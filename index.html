<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07110c" />
<title>FIFA Trio</title>
<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
<header>
<div class="brand"><div class="logo">⚽</div><div class="title"><h1>FIFA TRIO</h1><p>Steeve · Noham · Luc</p><div class="sync" id="syncLabel">Cloud : en attente</div></div></div>
<button class="icon-btn" id="menuBtn" type="button">⋯</button>
</header>
<main>
<section id="panel-rank" class="panel active">
<div class="podium" id="podium"></div>
<div class="table"><div class="thead"><div>#</div><div>Joueur</div><div class="muted">J</div><div class="muted">G</div><div class="muted">N</div><div class="muted">Diff</div><div class="muted">Pts</div></div><div id="tableBody"></div></div>
<p class="hint">Victoire = 3 pts · Nul = 1 pt · Défaite = 0</p>
</section>
<section id="panel-match" class="panel">
<div class="card">
<div class="players"><div class="p-pick"><select id="p1"></select></div><div class="vs">VS</div><div class="p-pick"><select id="p2"></select></div></div>
<div class="scores">
<div class="score-box"><button class="step" type="button" data-target="s1" data-delta="-1">−</button><input class="score" id="s1" inputmode="numeric" value="0" /><button class="step" type="button" data-target="s1" data-delta="1">+</button></div>
<div class="vs">–</div>
<div class="score-box"><button class="step" type="button" data-target="s2" data-delta="-1">−</button><input class="score" id="s2" inputmode="numeric" value="0" /><button class="step" type="button" data-target="s2" data-delta="1">+</button></div>
</div>
<button class="btn" id="saveBtn" type="button">Enregistrer le match</button>
<div class="error" id="err"></div><div class="ok" id="ok"></div>
</div>
</section>
<section id="panel-hist" class="panel"><div id="histList"></div></section>
</main>
<nav>
<button class="tab on" data-tab="rank" type="button">Classement</button>
<button class="tab" data-tab="match" type="button">Match</button>
<button class="tab" data-tab="hist" type="button">Histo</button>
</nav>
</div>
<div class="modal-bg" id="modal">
<div class="modal">
<h3>Options</h3>
<input id="fbUrl" type="url" placeholder="https://fifa-trio-default-rtdb.firebaseio.com" />
<button class="btn" id="saveFb" type="button">Activer le cloud</button>
<div class="row-btns"><button class="btn" id="exportBtn" type="button">Copier le code</button><button class="btn ghost" id="importBtn" type="button">Importer</button></div>
<textarea id="shareBox"></textarea>
<button class="btn danger" id="resetBtn" type="button">Réinitialiser</button>
<button class="btn ghost" id="closeModal" type="button">Fermer</button>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
