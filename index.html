<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#07110c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FIFA Trio" />
  <title>FIFA Trio — Steeve, Noham, Luc</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07110c;
      --bg-2: #0b1a12;
      --card: #102418;
      --card-2: #163022;
      --line: rgba(255,255,255,.08);
      --text: #f3f7f4;
      --muted: #8aa394;
      --gold: #f5c518;
      --gold-dim: rgba(245,197,24,.16);
      --green: #3ddc84;
      --red: #ff5a5a;
      --blue: #4ea3ff;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Outfit, system-ui, sans-serif; }
    body {
      background:
        radial-gradient(1200px 500px at 50% -10%, rgba(61,220,132,.12), transparent 55%),
        linear-gradient(180deg, #0a1810 0%, var(--bg) 40%);
      overflow: hidden;
    }
    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }
    header {
      padding: calc(14px + var(--safe-t)) 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(160deg, #1f6a3c, #0d3b22);
      display: grid; place-items: center; font-size: 22px;
      box-shadow: 0 8px 20px rgba(0,0,0,.35);
    }
    .title { line-height: 1; }
    .title h1 {
      margin: 0; font-family: "Bebas Neue", sans-serif;
      font-size: 28px; letter-spacing: .06em; color: #fff;
    }
    .title p { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-weight: 500; }
    .icon-btn {
      width: 40px; height: 40px; border: 1px solid var(--line);
      background: var(--card); color: var(--text); border-radius: 12px;
      display: grid; place-items: center; cursor: pointer; font-size: 18px;
    }
    main { flex: 1; overflow: auto; padding: 6px 16px 18px; }
    .panel { display: none; animation: fade .22s ease; }
    .panel.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 8px; align-items: end; margin: 8px 0 16px; }
    .pod {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 12px 8px 14px; text-align: center; min-height: 118px;
    }
    .pod.first { background: linear-gradient(180deg, rgba(245,197,24,.18), var(--card)); border-color: rgba(245,197,24,.35); min-height: 142px; }
    .medal { font-size: 22px; }
    .pod .name { font-weight: 700; margin-top: 4px; }
    .pod .pts { color: var(--gold); font-family: "Bebas Neue", sans-serif; font-size: 28px; letter-spacing: .04em; }
    .pod .sub { font-size: 11px; color: var(--muted); }
    .table { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
    .row, .thead {
      display: grid; grid-template-columns: 28px 1fr 28px 28px 28px 36px 34px;
      gap: 4px; align-items: center; padding: 11px 12px; font-size: 13px;
    }
    .thead { color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
    .row + .row { border-top: 1px solid var(--line); }
    .rank { color: var(--gold); font-weight: 800; }
    .pname { font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .av {
      width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
      font-size: 11px; font-weight: 800; color: #06110b;
    }
    .av.Steeve { background: #7ec0ff; }
    .av.Noham { background: #ff8b8b; }
    .av.Luc { background: #7dffb3; }
    .pts-cell { color: var(--gold); font-weight: 800; text-align: right; }
    .muted { color: var(--muted); text-align: center; }
    .hint { color: var(--muted); font-size: 12px; text-align: center; margin: 14px 8px 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
    .label { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; }
    .players { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 16px; }
    .p-pick { background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px; text-align: center; }
    .p-pick select, .p-pick input {
      width: 100%; background: transparent; border: 0; color: var(--text);
      font-family: inherit; font-weight: 700; font-size: 16px; text-align: center; outline: none;
    }
    .p-pick select option { background: #0e2218; }
    .vs { font-family: "Bebas Neue", sans-serif; font-size: 22px; color: var(--gold); }
    .scores { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
    .score-box { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .step {
      width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--card-2); color: #fff; font-size: 22px; font-weight: 700; cursor: pointer;
    }
    .score {
      width: 64px; height: 64px; border-radius: 16px; border: 1px solid rgba(245,197,24,.3);
      background: var(--gold-dim); color: var(--gold); text-align: center;
      font-family: "Bebas Neue", sans-serif; font-size: 36px; outline: none;
    }
    .btn {
      width: 100%; margin-top: 16px; border: 0; border-radius: 16px; height: 52px;
      background: linear-gradient(180deg, #f6d34a, #e0b40d); color: #1a1403;
      font-weight: 800; font-size: 16px; cursor: pointer; letter-spacing: .02em;
    }
    .btn:active { transform: scale(.98); }
    .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 600; }
    .btn.danger { background: #3a1515; color: #ffb4b4; border: 1px solid #5a2020; }
    .error {
      display: none; margin-top: 10px; color: #ffb4b4; background: #3a1515;
      border: 1px solid #5a2020; border-radius: 12px; padding: 10px 12px; font-size: 13px;
    }
    .ok {
      display: none; margin-top: 10px; color: #b6ffd4; background: #123322;
      border: 1px solid #1d5a3a; border-radius: 12px; padding: 10px 12px; font-size: 13px;
    }
    .match {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 12px 12px 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 10px;
    }
    .m-main { min-width: 0; }
    .m-date { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .m-score { font-weight: 700; font-size: 15px; }
    .m-score b { color: var(--gold); font-family: "Bebas Neue", sans-serif; font-size: 22px; font-weight: 400; }
    .del {
      border: 0; background: #2a1616; color: #ffb4b4; border-radius: 12px;
      padding: 0 12px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
    nav {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; padding: 10px 16px calc(12px + var(--safe-b));
      background: rgba(7,17,12,.92); border-top: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .tab {
      height: 48px; border: 1px solid var(--line); background: var(--card);
      color: var(--muted); border-radius: 14px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .tab.on { background: var(--gold-dim); color: var(--gold); border-color: rgba(245,197,24,.35); }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
      align-items: flex-end; justify-content: center; z-index: 20;
    }
    .modal-bg.show { display: flex; }
    .modal {
      width: 100%; max-width: 480px; background: #12261b; border-top: 1px solid var(--line);
      border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + var(--safe-b));
    }
    .modal h3 { margin: 0 0 8px; }
    textarea {
      width: 100%; min-height: 90px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--bg); color: var(--text); padding: 10px; font-family: inherit; font-size: 13px;
    }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">⚽</div>
        <div class="title">
          <h1>FIFA TRIO</h1>
          <p>Steeve · Noham · Luc</p>
        </div>
      </div>
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu">⋯</button>
    </header>
    <main>
      <section id="panel-rank" class="panel active">
        <div class="podium" id="podium"></div>
        <div class="table">
          <div class="thead">
            <div>#</div><div>Joueur</div><div class="muted">J</div><div class="muted">G</div><div class="muted">N</div><div class="muted">Diff</div><div class="muted">Pts</div>
          </div>
          <div id="tableBody"></div>
        </div>
        <p class="hint">Victoire = 3 pts · Nul = 1 pt · Défaite = 0</p>
      </section>
      <section id="panel-match" class="panel">
        <div class="card">
          <div class="label">Nouveau match</div>
          <div class="players">
            <div class="p-pick"><select id="p1"></select></div>
            <div class="vs">VS</div>
            <div class="p-pick"><select id="p2"></select></div>
          </div>
          <div class="scores">
            <div class="score-box">
              <button class="step" type="button" data-target="s1" data-delta="-1">−</button>
              <input class="score" id="s1" inputmode="numeric" value="0" maxlength="2" />
              <button class="step" type="button" data-target="s1" data-delta="1">+</button>
            </div>
            <div class="vs">–</div>
            <div class="score-box">
              <button class="step" type="button" data-target="s2" data-delta="-1">−</button>
              <input class="score" id="s2" inputmode="numeric" value="0" maxlength="2" />
              <button class="step" type="button" data-target="s2" data-delta="1">+</button>
            </div>
          </div>
          <button class="btn" id="saveBtn" type="button">Enregistrer le match</button>
          <div class="error" id="err"></div>
          <div class="ok" id="ok"></div>
        </div>
      </section>
      <section id="panel-hist" class="panel">
        <div id="histList"></div>
      </section>
    </main>
    <nav>
      <button class="tab on" data-tab="rank" type="button">Classement</button>
      <button class="tab" data-tab="match" type="button">Match</button>
      <button class="tab" data-tab="hist" type="button">Histo</button>
    </nav>
  </div>
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h3>Options</h3>
      <p class="hint" style="text-align:left;margin:0 0 10px">Les données restent sur ce téléphone. Pour les partager, copie le code et colle-le sur l’autre tel.</p>
      <div class="row-btns">
        <button class="btn" id="exportBtn" type="button" style="margin:0">Copier le code</button>
        <button class="btn ghost" id="importBtn" type="button" style="margin:0">Importer</button>
      </div>
      <textarea id="shareBox" placeholder="Colle ici un code de ligue…"></textarea>
      <button class="btn danger" id="resetBtn" type="button">Réinitialiser la saison</button>
      <button class="btn ghost" id="closeModal" type="button">Fermer</button>
    </div>
  </div>
  <script>
    const PLAYERS = ["Steeve", "Noham", "Luc"];
    const KEY = "fifa-trio-v1";
    const $ = (id) => document.getElementById(id);
    const state = load();
    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return { matches: [] };
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.matches)) return { matches: [] };
        return { matches: data.matches.filter(validMatch) };
      } catch (e) { return { matches: [] }; }
    }
    function validMatch(m) {
      return m && PLAYERS.includes(m.p1) && PLAYERS.includes(m.p2) && m.p1 !== m.p2
        && Number.isInteger(m.s1) && Number.isInteger(m.s2) && m.s1 >= 0 && m.s2 >= 0
        && typeof m.id === "string";
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function compute() {
      const table = {};
      PLAYERS.forEach((p) => { table[p] = { name: p, j: 0, g: 0, n: 0, p: 0, bp: 0, bc: 0, diff: 0, pts: 0 }; });
      state.matches.forEach((m) => {
        const a = table[m.p1], b = table[m.p2];
        a.j++; b.j++;
        a.bp += m.s1; a.bc += m.s2;
        b.bp += m.s2; b.bc += m.s1;
        if (m.s1 > m.s2) { a.g++; b.p++; a.pts += 3; }
        else if (m.s1 < m.s2) { b.g++; a.p++; b.pts += 3; }
        else { a.n++; b.n++; a.pts += 1; b.pts += 1; }
      });
      PLAYERS.forEach((p) => { table[p].diff = table[p].bp - table[p].bc; });
      return PLAYERS.map((p) => table[p]).sort((a, b) =>
        b.pts - a.pts || b.diff - a.diff || b.bp - a.bp || a.name.localeCompare(b.name)
      );
    }
    function fillSelects() {
      $("p1").innerHTML = PLAYERS.map((p) => `<option value="${p}">${p}</option>`).join("");
      $("p2").innerHTML = PLAYERS.map((p) => `<option value="${p}">${p}</option>`).join("");
      $("p1").value = "Steeve";
      $("p2").value = "Noham";
    }
    function renderRank() {
      const rows = compute();
      const medals = ["🥇", "🥈", "🥉"];
      const order = [rows[1], rows[0], rows[2]];
      $("podium").innerHTML = order.map((r, i) => {
        const real = i === 1 ? 0 : i === 0 ? 1 : 2;
        const cls = real === 0 ? "pod first" : "pod";
        return `<div class="${cls}">
          <div class="medal">${medals[real]}</div>
          <div class="name">${r.name}</div>
          <div class="pts">${r.pts} pts</div>
          <div class="sub">${r.g}V · ${r.n}N · ${r.p}D</div>
        </div>`;
      }).join("");
      $("tableBody").innerHTML = rows.map((r, i) => `
        <div class="row">
          <div class="rank">${i + 1}</div>
          <div class="pname"><span class="av ${r.name}">${r.name[0]}</span>${r.name}</div>
          <div class="muted">${r.j}</div>
          <div class="muted">${r.g}</div>
          <div class="muted">${r.n}</div>
          <div class="muted">${r.diff > 0 ? "+" + r.diff : r.diff}</div>
          <div class="pts-cell">${r.pts}</div>
        </div>`).join("");
    }
    function renderHist() {
      const list = $("histList");
      if (!state.matches.length) {
        list.innerHTML = `<div class="empty">Aucun match pour le moment.<br>Ajoute le premier résultat ⚽</div>`;
        return;
      }
      const sorted = [...state.matches].sort((a, b) => (b.ts || 0) - (a.ts || 0));
      list.innerHTML = sorted.map((m) => {
        const d = new Date(m.ts || Date.now());
        const date = d.toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
        return `<div class="match">
          <div class="m-main">
            <div class="m-date">${date}</div>
            <div class="m-score">${m.p1} <b>${m.s1} – ${m.s2}</b> ${m.p2}</div>
          </div>
          <button class="del" type="button" data-id="${m.id}">Suppr.</button>
        </div>`;
      }).join("");
    }
    function show(tab) {
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === tab));
      $("panel-" + tab).classList.add("active");
    }
    function clampScore(n) {
      n = parseInt(n, 10);
      if (!Number.isFinite(n) || n < 0) n = 0;
      if (n > 99) n = 99;
      return n;
    }
    function setScore(id, val) { $(id).value = String(clampScore(val)); }
    function flash(el, msg) {
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 2200);
    }
    function addMatch() {
      const p1 = $("p1").value;
      const p2 = $("p2").value;
      const s1 = clampScore($("s1").value);
      const s2 = clampScore($("s2").value);
      if (p1 === p2) return flash($("err"), "Choisis deux joueurs différents.");
      if (!PLAYERS.includes(p1) || !PLAYERS.includes(p2)) return flash($("err"), "Joueur invalide.");
      state.matches.push({ id: uid(), ts: Date.now(), p1, p2, s1, s2 });
      save();
      setScore("s1", 0);
      setScore("s2", 0);
      renderRank();
      renderHist();
      flash($("ok"), "Match enregistré.");
    }
    function encodeShare() {
      return btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, matches: state.matches }))));
    }
    function importShare(raw) {
      try {
        const parsed = JSON.parse(decodeURIComponent(escape(atob(raw.trim()))));
        if (!parsed || !Array.isArray(parsed.matches)) throw new Error("format");
        const incoming = parsed.matches.filter(validMatch);
        const seen = new Set(state.matches.map((m) => m.id));
        let added = 0;
        incoming.forEach((m) => {
          if (!seen.has(m.id)) { state.matches.push(m); seen.add(m.id); added++; }
        });
        save(); renderRank(); renderHist();
        return added;
      } catch (e) { throw new Error("Code invalide."); }
    }
    document.querySelectorAll(".tab").forEach((btn) => btn.addEventListener("click", () => show(btn.dataset.tab)));
    document.querySelectorAll(".step").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.target;
        setScore(id, clampScore($(id).value) + Number(btn.dataset.delta));
      });
    });
    ["s1", "s2"].forEach((id) => {
      $(id).addEventListener("input", () => setScore(id, $(id).value.replace(/\D/g, "")));
    });
    $("saveBtn").addEventListener("click", addMatch);
    $("histList").addEventListener("click", (e) => {
      const btn = e.target.closest(".del");
      if (!btn) return;
      if (!confirm("Supprimer ce match ?")) return;
      state.matches = state.matches.filter((m) => m.id !== btn.dataset.id);
      save(); renderRank(); renderHist();
    });
    $("menuBtn").addEventListener("click", () => $("modal").classList.add("show"));
    $("closeModal").addEventListener("click", () => $("modal").classList.remove("show"));
    $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) $("modal").classList.remove("show"); });
    $("exportBtn").addEventListener("click", async () => {
      const code = encodeShare();
      $("shareBox").value = code;
      try {
        await navigator.clipboard.writeText(code);
        $("exportBtn").textContent = "Copié !";
        setTimeout(() => { $("exportBtn").textContent = "Copier le code"; }, 1500);
      } catch (e) { $("exportBtn").textContent = "Code affiché"; }
    });
    $("importBtn").addEventListener("click", () => {
      try {
        const added = importShare($("shareBox").value);
        alert(added + " match(s) importé(s).");
      } catch (e) { alert(e.message || "Import impossible."); }
    });
    $("resetBtn").addEventListener("click", () => {
      if (!confirm("Effacer tous les matchs de ce téléphone ?")) return;
      state.matches = [];
      save(); renderRank(); renderHist();
      $("modal").classList.remove("show");
    });
    fillSelects(); renderRank(); renderHist();
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
